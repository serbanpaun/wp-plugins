name: Deploy old-post-warning to WordPress.org

on:
  push:
    branches:
      - main
    paths:
      - 'old-post-warning/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 Extract version from plugin header
      - name: Get plugin version
        id: get_version
        run: |
          VERSION=$(grep -i "Version:" old-post-warning/plugin.php | head -n1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 3 Install SVN
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      # 4 Checkout SVN repo
      - name: Checkout SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          svn checkout \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache \
            https://plugins.svn.wordpress.org/old-post-warning/ svn

      # 5 Sync files to trunk
      - name: Sync files to trunk
        run: |
          rm -rf svn/trunk/*
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            old-post-warning/ svn/trunk/
          cd svn
          svn add --force trunk || true

      # 6 Commit to trunk
      - name: Commit to trunk
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          cd svn
          svn commit -m "Deploy version ${{ steps.get_version.outputs.version }}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive || echo "No changes to commit"

      # 7 Tag release
      - name: Create SVN tag
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          cd svn
          VERSION=${{ steps.get_version.outputs.version }}
          # If tag already exists, skip
          if svn ls tags/$VERSION > /dev/null 2>&1; then
            echo "Tag already exists. Skipping."
          else
            svn copy trunk tags/$VERSION
            svn commit -m "Tagging version $VERSION" \
              --username "$SVN_USERNAME" \
              --password "$SVN_PASSWORD" \
              --non-interactive
          fi
