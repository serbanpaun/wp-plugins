name: Deploy old-post-warning to WordPress.org

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from plugin file
        id: get_version
        run: |
          VERSION=$(grep -i "Version:" old-post-warning.php | head -n1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Checkout SVN repo
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          svn checkout \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache \
            https://plugins.svn.wordpress.org/old-post-warning/ svn

      - name: Sync files to trunk
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ svn/trunk/

          cd svn
          svn add --force trunk

      - name: Commit to trunk
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          cd svn
          svn commit -m "Deploy version ${{ steps.get_version.outputs.version }}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive

      - name: Tag release
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          cd svn
          svn copy trunk tags/${{ steps.get_version.outputs.version }} -m "Tag version ${{ steps.get_version.outputs.version }}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive